name: Flutter CI

on:
  push:
    branches: [ SetupServer ]
  pull_request:
    branches: [ SetupServer ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: cd epiflipboard && flutter pub get
      - run: cd epiflipboard && flutter test
